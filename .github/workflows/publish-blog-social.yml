name: Publicar artigo nas redes sociais

on:
  push:
    branches:
      - main
    paths:
      - "blog/**/social.json"
  workflow_dispatch:
    inputs:
      social_file:
        description: "Caminho do arquivo blog/slug/social.json"
        required: true
        type: string
      dry_run:
        description: "Somente validar, sem publicar"
        required: true
        default: true
        type: boolean
      channels:
        description: "Canais explícitos: facebook, instagram ou facebook,instagram"
        required: true
        default: facebook
        type: string

permissions:
  contents: write

concurrency:
  group: publicacao-social-blog
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar nos canais selecionados
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Publicar conteúdo derivado do artigo
        env:
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_BUSINESS_ID: "521532175593406"
          META_PAGE_ID: "102252752160102"
          META_GRAPH_VERSION: "v26.0"
          SITE_BASE_URL: "https://www.belezanacapital.com.br"
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          SOCIAL_FILE: ${{ inputs.social_file }}
          SOCIAL_CHANNELS: ${{ inputs.channels }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: node scripts/publish-blog-social.mjs
